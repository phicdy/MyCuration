name: Debug APK

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches:
      - develop
  push:
    branches:
      - develop

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug_apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICE: ${{ secrets.GOOGLE_SERVICE}}
        run: echo $GOOGLE_SERVICE | base64 --decode > ./app/google-services.json
      - name: Decode debug keystore
        id: keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            keystore_path="$RUNNER_TEMP/debug-ci.keystore"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
            echo "path=$keystore_path" >> "$GITHUB_OUTPUT"
            echo "fixed=true" >> "$GITHUB_OUTPUT"
          else
            echo "DEBUG_KEYSTORE_BASE64 is not set; signing with the runner's debug keystore."
            echo "fixed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build debug APK
        env:
          DEBUG_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug
      - name: Rename APK
        id: apk
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::No debug APK found in app/build/outputs/apk/debug"
            exit 1
          fi
          if [ -n "$PR_NUMBER" ]; then
            name="mycuration-debug-pr${PR_NUMBER}.apk"
          else
            name="mycuration-debug-develop.apk"
          fi
          mkdir -p "$RUNNER_TEMP/apk"
          cp "$apk" "$RUNNER_TEMP/apk/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/apk/$name" >> "$GITHUB_OUTPUT"
      - name: Upload debug APK
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
      - name: Create comment body
        id: body
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          APK_NAME: ${{ steps.apk.outputs.name }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          FIXED_KEYSTORE: ${{ steps.keystore.outputs.fixed }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo 'body<<DEBUG_APK_COMMENT_EOF'
            echo '<!-- debug-apk-comment -->'
            echo '## Debug APK'
            echo ''
            echo "Download: [${APK_NAME}](${ARTIFACT_URL})"
            echo ''
            echo "- Commit: \`${HEAD_SHA:0:7}\`"
            echo "- Run: ${RUN_URL}"
            if [ "$FIXED_KEYSTORE" = "true" ]; then
              echo '- Signed with the fixed CI debug keystore, so it installs over earlier CI builds.'
            else
              echo "- :warning: DEBUG_KEYSTORE_BASE64 is not set, so this APK is signed with the runner's random debug key and cannot be installed over a previous build."
            fi
            echo ''
            echo '_The download link requires being logged in to GitHub._'
            echo 'DEBUG_APK_COMMENT_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Find debug APK comment
        uses: peter-evans/find-comment@0ab0dc781059d605234c6f0b3e02a2764a42d456
        id: find_comment
        if: steps.body.outcome == 'success'
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- debug-apk-comment -->'
      - name: Create or update debug APK comment
        uses: peter-evans/create-or-update-comment@35d33e4f3771787d0f602f5dca94f47c68b5cc60
        if: steps.body.outcome == 'success'
        with:
          body: ${{ steps.body.outputs.body }}
          edit-mode: replace
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          token: ${{ secrets.GITHUB_TOKEN }}
