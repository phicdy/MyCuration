name: tmp diagnose hatena
on: push
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Old UA sequence
        run: |
          UA="Mozilla/5.0 (Windows NT 6.1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/28.0.1500.63 Safari/537.36"
          r=""
          for u in https://b.hatena.ne.jp/hotentry/game https://b.hatena.ne.jp/hotentry/game https://b.hatena.ne.jp/hotentry/game.rss; do
            r="$r $(curl -s -L --compressed -A "$UA" -o p.html -w '%{http_code}' "$u")"
          done
          echo "::notice title=OLD codes::$r"
          echo "::notice title=OLD links::$(grep -o -i -E '<link[^>]*(alternate|canonical)[^>]*>' p.html | head -4 | tr '\n' ' ')"
      - name: New UA sequence
        run: |
          sleep 20
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
          r=""
          for u in https://b.hatena.ne.jp/hotentry/game https://b.hatena.ne.jp/hotentry/game https://b.hatena.ne.jp/hotentry/game.rss https://ground-sesame.hatenablog.jp https://ground-sesame.hatenablog.jp/ https://ground-sesame.hatenablog.jp/rss; do
            r="$r $(curl -s -L --compressed -A "$UA" -o p$RANDOM.html -w '%{http_code}' "$u")"
          done
          echo "::notice title=NEW codes::$r"
          curl -s -L --compressed -A "$UA" -o g.html https://b.hatena.ne.jp/hotentry/game
          echo "::notice title=NEW game links::$(grep -o -i -E '<link[^>]*(alternate|canonical)[^>]*>' g.html | head -4 | tr '\n' ' ')"
