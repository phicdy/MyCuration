name: tmp diagnose
on: push
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - run: |
          OLD="Mozilla/5.0 (Windows NT 6.1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/28.0.1500.63 Safari/537.36"
          NEW="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
          for label in OLD NEW; do
            ua="${!label}"; r=""
            for u in https://www.a-kimama.com https://www.a-kimama.com/feed; do
              r="$r | $(curl -s -L --compressed -A "$ua" -o p.html -w '%{http_code} %{content_type} %{url_effective}' "$u") size=$(wc -c < p.html) head=$(head -c 120 p.html | tr -d '\n\r' | tr -c '[:print:]' ' ')"
            done
            echo "::notice title=$label::$r"
            curl -s -L --compressed -A "$ua" -o h.html https://www.a-kimama.com
            echo "::notice title=$label links::$(grep -o -i -E '<link[^>]*(alternate|canonical)[^>]*>' h.html | head -4 | tr '\n' ' ')"
          done
