name: tmp diagnose
on: push
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICE: ${{ secrets.GOOGLE_SERVICE }}
        run: echo $GOOGLE_SERVICE | base64 --decode > ./app/google-services.json
      - name: Build
        run: |
          set +e
          ./gradlew ${GRADLE_TASKS:-testDebugUnitTest lintDebug} --continue > out.txt 2>&1
          code=$?
          enc() { python3 -c 'import sys;d=sys.stdin.read();print(d.replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          echo "::notice title=exit::$code"
          grep -n -A28 "What went wrong" out.txt | head -150 > wrong.txt
          if [ -s wrong.txt ]; then echo "::error title=what went wrong::$(enc < wrong.txt)"; fi
          grep -E "^e: |error:|\[Hilt\]" out.txt | sort -u | head -40 > errs.txt
          if [ -s errs.txt ]; then echo "::error title=compile errors::$(enc < errs.txt)"; fi
          grep -E "tests completed|FAILED$" out.txt | head -20 > tests.txt
          if [ -s tests.txt ]; then echo "::notice title=tests::$(enc < tests.txt)"; fi
          tail -5 out.txt > tail.txt; echo "::notice title=tail::$(enc < tail.txt)"
