plugins {
    alias(libs.plugins.compose.compiler)
    alias(libs.plugins.google.ksp)
    alias(libs.plugins.screenshot)
}

apply plugin: 'dagger.hilt.android.plugin'

android {
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        compose true
    }
    namespace 'com.phicdy.mycuration.articlelist'
    experimentalProperties["android.experimental.enableScreenshotTest"] = true
}

dependencies {
    implementation project(':core')
    implementation project(':entity')
    implementation project(':feature_util')
    implementation project(':glide')
    implementation project(':resource')
    implementation project(':repository')
    implementation project(':tracker')
    implementation project(':advertisement')
    implementation project(':action_article_list')

    implementation libs.appcompat
    implementation libs.core
    implementation libs.recyclerview
    implementation libs.lifecycle.runtime
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.browser
    implementation libs.fragment
    implementation libs.compose.material3

    implementation libs.coroutines.core
    implementation libs.coroutines.android

    implementation libs.dagger.hilt
    ksp libs.dagger.hilt.compiler

    implementation libs.glide

    testImplementation libs.core.testing
    testImplementation libs.coroutines.test

    screenshotTestImplementation platform(libs.compose.bom)
    screenshotTestImplementation libs.screenshot.validation.api
    screenshotTestImplementation libs.compose.ui.tooling
}
