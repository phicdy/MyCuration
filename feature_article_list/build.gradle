plugins {
    alias(libs.plugins.compose.compiler)
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.google.ksp)
}

apply plugin: 'dagger.hilt.android.plugin'

android {
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        compose true
    }
    namespace 'com.phicdy.mycuration.articlelist'
    testOptions {
        // Compose Preview Screenshot Testing with AGP test suites.
        // Sources live in src/screenshotTest/kotlin.
        screenshotTests.create('screenshotTest') { suite ->
            suite.engineVersion = libs.versions.screenshot.get()
            suite.targetVariants.add('debug')
            suite.dependencies { deps ->
                deps.implementation.add(project.dependencies.platform(libs.compose.bom))
                deps.implementation.add(libs.compose.ui.tooling)
                deps.implementation.add(libs.screenshot.validation.api)
            }
        }
    }
}

dependencies {
    implementation project(':core')
    implementation project(':entity')
    implementation project(':feature_util')
    implementation project(':glide')
    implementation project(':resource')
    implementation project(':repository')
    implementation project(':tracker')
    implementation project(':advertisement')
    implementation project(':action_article_list')

    implementation libs.appcompat
    implementation libs.core
    implementation libs.recyclerview
    implementation libs.lifecycle.runtime
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.browser
    implementation libs.fragment
    implementation libs.fragment.compose
    implementation libs.compose.material3
    implementation libs.compose.material3.adaptive
